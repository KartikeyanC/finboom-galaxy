<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PWA / installable web app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0B231C" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FinRoot" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Kept in step with BrandDocumentTitle, which sets the same title once React runs. -->
    <title>FinRoot — Money, gently managed</title>
    <meta name="description" content="One money plan the whole family can see. FinRoot divides each month across seven buckets — Needs to Agri — with bills, premiums, goals and investments in one private ledger. Free plan, no tracking cookies." />
    <meta name="author" content="FinRoot" />

    <meta property="og:site_name" content="FinRoot" />
    <meta property="og:title" content="FinRoot — One money plan the whole family can see" />
    <meta property="og:description" content="Seven buckets for every paycheck, bills and premiums on one calendar, and household roles for who sees what. Made in India." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_IN" />
    <!--
      og:image / twitter:image / canonical need an absolute URL on the
      production domain, which isn't settled yet. The old values pointed at
      Lovable's generic image and @Lovable account — wrong for a FinRoot share
      card — so they were removed rather than left misattributed.
    -->
    <script type="application/ld+json">
      {"@context":"https://schema.org","@type":"WebApplication","name":"FinRoot","applicationCategory":"FinanceApplication","operatingSystem":"Web","description":"One money plan the whole family can see: seven-bucket budgeting, bills and premiums on one calendar, goals and investments in one private ledger.","inLanguage":"en-IN"}
    </script>
    <!--
      Fonts are self-hosted (see public/fonts/README.md). One `latin` variable
      file covers the whole weight range; `latin-ext` is left to unicode-range
      to fetch on demand (the ₹ sign, U+20B9, lives there).

      Only IBM Plex Sans is preloaded. Space Grotesk deliberately is NOT:
      it is reachable only through Tailwind's `font-display` class, and a walk
      of all 1010 rendered elements on the landing page found zero users of it,
      so preloading it here would put 21 kB of contention on the LCP page to
      speed up a route the visitor may never open. On /app it starts loading
      from CSS the moment the first heading renders, which is still far ahead
      of the cross-origin @import this replaced.

      `crossorigin` is required even though this is same-origin: fonts are
      always fetched in CORS mode, and a preload whose mode does not match the
      real request is simply downloaded twice.
    -->
    <link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />

    <meta name="twitter:card" content="summary" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
