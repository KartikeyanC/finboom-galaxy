name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Each step runs even if an earlier one failed, so a single CI run
      # reports every class of problem instead of only the first.
      - name: Typecheck
        id: typecheck
        run: npm run typecheck

      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: npm test

      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build

      # Budget both the entry chunk AND everything a first visit actually
      # downloads. Stage 4.1 took the entry from 736 kB gz to ~83 and the whole
      # first load to ~228, so the ceilings below leave working room without
      # letting either quietly drift back.
      #
      # The entry is read from index.html rather than globbed: route splitting
      # produces several `index-*.js` files (a page can be named Index too), and
      # the old `find … | head -n1` could measure the wrong one and pass while
      # the real entry ballooned.
      - name: Bundle size budget
        if: ${{ !cancelled() }}
        run: |
          ENTRY_BUDGET_KB=150
          FIRST_LOAD_BUDGET_KB=300

          ENTRY=$(grep -o 'src="/assets/[^"]*\.js"' dist/index.html | head -n1 | sed 's|src="/||; s|"$||')
          if [ -z "$ENTRY" ] || [ ! -f "dist/$ENTRY" ]; then
            echo "::error::Could not find the entry script in dist/index.html"
            exit 1
          fi

          ENTRY_KB=$(gzip -c "dist/$ENTRY" | wc -c | awk '{print int($1/1024)}')
          echo "Entry chunk: ${ENTRY_KB} kB gz (budget ${ENTRY_BUDGET_KB} kB) — $ENTRY"

          # Entry + every modulepreload = what the browser fetches before paint.
          TOTAL=0
          for f in $(grep -o 'href="/assets/[^"]*\.js"' dist/index.html | sed 's|href="/||; s|"$||'); do
            [ -f "dist/$f" ] || continue
            KB=$(gzip -c "dist/$f" | wc -c | awk '{print int($1/1024)}')
            TOTAL=$((TOTAL + KB))
            echo "  preload: $f  ${KB} kB gz"
          done
          FIRST_LOAD_KB=$((TOTAL + ENTRY_KB))
          echo "First load: ${FIRST_LOAD_KB} kB gz (budget ${FIRST_LOAD_BUDGET_KB} kB)"

          FAIL=0
          if [ "$ENTRY_KB" -gt "$ENTRY_BUDGET_KB" ]; then
            echo "::error::Entry chunk ${ENTRY_KB} kB exceeds the ${ENTRY_BUDGET_KB} kB budget"
            FAIL=1
          fi
          if [ "$FIRST_LOAD_KB" -gt "$FIRST_LOAD_BUDGET_KB" ]; then
            echo "::error::First load ${FIRST_LOAD_KB} kB exceeds the ${FIRST_LOAD_BUDGET_KB} kB budget"
            echo "::error::A heavy library probably became reachable from the entry — check index.html's modulepreload list"
            FAIL=1
          fi
          exit $FAIL

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Informational until the xlsx prototype-pollution advisory is resolved
    # (no upstream fix on npm). Flip continue-on-error off once it is clean.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: verify
    # Requires E2E_EMAIL / E2E_PASSWORD / E2E_PIN plus the Supabase env to be
    # configured as repository secrets; skipped entirely when they are absent.
    if: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Check for E2E credentials
        id: creds
        run: |
          if [ -n "${{ secrets.E2E_EMAIL }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "E2E secrets not configured — skipping."
          fi

      - name: Install Playwright browser
        if: steps.creds.outputs.present == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run Playwright suite
        if: steps.creds.outputs.present == 'true'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_PIN: ${{ secrets.E2E_PIN }}
        run: npm run e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() && steps.creds.outputs.present == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
